name: CI/CD
permissions:
  contents: write
  actions: write
  packages: write

on:
  workflow_dispatch:

jobs:
  tag:
    name: Tag 🏷️
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - name: 🔽 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ⏫ Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
  ci:
    name: Build and Push 🚀
    runs-on: ubuntu-latest
    needs: tag

    steps:
      - name: 🔽 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set version on project
        run: |
          sed -i 's/version=.*/version=${{ needs.tag.outputs.tag }}/g' src/main/resources/stickee.properties
      - name: 🔧 Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # list of Docker images to use as base name for tags
          images: ghcr.io/siesta-cat/stickee
          # generate Docker tags based on the following events/attributes
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ needs.tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.tag.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.tag.outputs.tag }}
      - name: Set up Docker Context for Buildx
        id: buildx-context
        continue-on-error: true
        run: |
          docker context create builders
      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          endpoint: builders
      - name: 🪵 Login to docker registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 🏗️ Build and Push ⏫
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
